name: Build Red Light APK

on:
  push:
    branches: ['**']
    paths:
      - 'red-light/**'
      - '.github/workflows/red-light-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK
        working-directory: red-light
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: red-light-debug-apk
          path: red-light/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as a GitHub Release
        # Standalone app, unrelated to Daily Routines' latest-android / latest-android-dev tags.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: red-light-latest
          name: "Red Light (run ${{ github.run_number }})"
          body: |
            Red-only screen flashlight, built from commit ${{ github.sha }}.
          prerelease: true
          files: red-light/app/build/outputs/apk/debug/app-debug.apk
